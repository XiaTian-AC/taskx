# GoReleaser config — tkx release pipeline.
# Docs: https://goreleaser.com
#
# Triggered by git tag v0.1.0 via .github/workflows/release.yml.

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: tkx
    main: .
    binary: tkx
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: tkx
    formats: [zip, tar.gz]
    name_template: >-
      {{ .ProjectName }}-{{ .Os }}-{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - README-*.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
